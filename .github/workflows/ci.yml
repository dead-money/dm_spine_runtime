name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Run JavaScript actions on Node 24; GitHub deprecated Node 20.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout spine_runtime
        uses: actions/checkout@v6
        with:
          path: spine_runtime

      # Tests load example rigs from a sibling spine-runtimes/ checkout.
      - name: Checkout spine-runtimes (upstream)
        uses: actions/checkout@v6
        with:
          repository: EsotericSoftware/spine-runtimes
          # upstream/4.3, pinned; bump with the capture harness and fixtures.
          ref: ba17cf88b198c6531c6c51d8d4e1e4b3c3ab47dd
          path: spine-runtimes

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: spine_runtime

      - name: cargo fmt
        working-directory: spine_runtime
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: spine_runtime
        run: cargo clippy --all-targets

      - name: cargo test
        working-directory: spine_runtime
        run: cargo test --all-targets

      - name: cargo package
        working-directory: spine_runtime
        run: cargo package

      - name: Build capture harness against pinned spine-cpp
        working-directory: spine_runtime/tools/spine_capture
        run: make -j4 SPINE_RUNTIMES="$GITHUB_WORKSPACE/spine-runtimes"

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo doc
        run: cargo doc --no-deps
