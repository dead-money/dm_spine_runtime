[package]
name = "spine_runtime"
version = "0.1.0"
edition = "2024"
description = "Unofficial native Rust port of the Spine 4.3 runtime. Renderer-agnostic."
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/dead-money/spine_runtime"
categories = ["game-development", "graphics"]
keywords = ["spine", "2d", "animation", "skeletal"]

[dependencies]
glam = "0.32"
thiserror = "2"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
approx = "0.5"
proptest = "1"
pretty_assertions = "1"
# Used only by the golden-pose integration test to parse capture fixtures.
serde = { version = "1", features = ["derive"] }
# Used by the software_render example for PNG IO. Dev-only — does not
# leak into the library's dep graph.
image = { version = "0.25", default-features = false, features = ["png"] }

[[bench]]
name = "frame"
harness = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Spine uses f32 pervasively; these lints fire constantly on faithful C++ ports
# without adding value.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
module_name_repetitions = "allow"
# Literal ports of spine-cpp functions keep their length, parameter lists,
# single-letter math names, exact float sentinels and flag fields.
too_many_lines = "allow"
too_many_arguments = "allow"
many_single_char_names = "allow"
float_cmp = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"

[profile.bench]
debug = true
